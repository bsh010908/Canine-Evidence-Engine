[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "canine-evidence-engine"
version = "0.1.0"
description = "Source-preserving PubMed literature retrieval"
requires-python = ">=3.12,<3.13"
dependencies = ["httpx>=0.27,<1", "pydantic>=2.8,<3", "python-dotenv>=1,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2", "respx>=0.22,<1"]

[project.scripts]
canine-pubmed = "canine_evidence.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["live_api: real NCBI requests; opt in with NCBI_LIVE_TEST=1"]

